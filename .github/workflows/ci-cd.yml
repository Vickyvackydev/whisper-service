name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-go:
    name: Test & Build Go API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Build Go API Server Binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o bin/server ./cmd/server
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o bin/benchmark ./cmd/benchmark

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-api-binaries
          path: bin/

  test-python:
    name: Lint & Verify Python Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint Python ML Worker
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 ml_worker --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ml_worker --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  deploy:
    name: Production Deployment (Native/SSH)
    needs: [test-go, test-python]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Go Binaries
        uses: actions/download-artifact@v4
        with:
          name: whisper-api-binaries
          path: bin/

      - name: Deploy to GPU Instance via SSH (Example)
        if: env.DEPLOY_SSH_HOST != ''
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "Deploying update to target GPU server..."
          # 1. Sync Go binary and ml_worker python files
          # 2. Restart systemd services (whisper-api & whisper-worker)
          # ssh user@host "sudo systemctl restart whisper-api whisper-worker"
